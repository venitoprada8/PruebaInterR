version: "3.8"

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: student_registry_db
    environment:
      MYSQL_DATABASE: ${DB_NAME:-StudentRegistrationDB}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-toor}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - student_network

  # Backend .NET
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student_registry_backend
    environment:
      DB_SERVER: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-StudentRegistrationDB}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-toor}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5066:8080"
    depends_on:
      - mysql
    networks:
      - student_network
    restart: unless-stopped

  # Frontend Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: student_registry_frontend
    environment:
      API_URL: http://backend:8080
    ports:
      - "8080:4200"
    depends_on:
      - backend
    networks:
      - student_network
    restart: unless-stopped

networks:
  student_network:
    driver: bridge

volumes:
  db_data:
    driver: local
